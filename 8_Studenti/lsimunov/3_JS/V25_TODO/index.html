<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>My tasks</h1>
    <div class="button-group">
      <button class="" disabled>All</button>
    <button class="">Active</button>
    <button class="">Completed</button>
    </div>
  </header>
  <main>
    <div id="section-todo">
      <div id="section-input">
        <input type="text" id="input-text" placeholder="Add todo">
        <input type="submit" value="Add" id="input-add">
      </div>
      <ul></ul>
    </div>
    <div id="section-clear-completed">
      <button id="button-clear-completed">Clear completed</button>
    </div>
    <script src="script.js"></script>
  </main>
</body>
</html>
